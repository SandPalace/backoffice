<!doctype html>
<!--
  Cartoon Lyric — a 15 s vertical cartoon music video cut on the beat (rendered by render/gsap/render.mjs).
  The language of a 2D lyric video: hard cuts every 1–2 s, limited two-pose animation, line boil,
  radial sunbursts, bubble-letter punch-ins, a title splash, a horror reveal and an iris-out.
  The cast is original: egg-shaped party guests in Venetian masks (rig: squash, arms at the
  shoulder, pupils, four mouths, sweat, a mask that can fall and a void face under it).
    1  night  mansion on a hill bouncing to the beat          5  "¿TÚ?"  accuser on a red sunburst
    2  ball   four guests side-eye each other, camera pans    6  title splash, silhouettes, confetti
    3  dark   lights out, only eyes                           7  a mask falls: silence, horror hit
    4  "¿YO?" bubble letters, guest points at itself          8  host on a green burst, iris-out
  Lyrics, palette, cast and score events come from window.__props. One paused timeline.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cartoon Lyric</title>
<style>
  @font-face { font-family: "Lucky"; src: url("../../../tesseract/fonts/luckiestguy/LuckiestGuy-Regular.ttf"); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  svg.full { position: absolute; inset: 0; width: 1080px; height: 1920px; }
  .cap { position: absolute; left: 70px; right: 70px; top: 1380px; text-align: center; visibility: hidden;
         font-family: "Lucky"; font-size: 84px; line-height: 1.05; color: #FFF4E0; letter-spacing: 0.02em;
         -webkit-text-stroke: 16px #1B1030; paint-order: stroke fill; text-shadow: 0 9px 0 #1B1030; }
  .cap span { display: inline-block; margin: 0 0.12em; }
</style>
</head>
<body>
<div id="stage">
  <svg class="full" id="svg" viewBox="0 0 1080 1920">
    <defs>
      <filter id="boil" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="1"/>
        <feDisplacementMap in="SourceGraphic" scale="7" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--night)"/><stop offset="1" stop-color="var(--night2)"/>
      </linearGradient>
      <radialGradient id="spot" cx="0.5" cy="0.35" r="0.7">
        <stop offset="0" stop-color="var(--wall2)"/><stop offset="1" stop-color="#140A2A"/>
      </radialGradient>
      <pattern id="stripes" width="120" height="120" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
        <rect width="120" height="120" fill="var(--pink)"/><rect width="60" height="120" fill="var(--pink2)"/>
      </pattern>
    </defs>
    <g id="world" filter="url(#boil)">
      <g class="scene" id="s1"><g class="cam" id="cam1"></g></g>
      <g class="scene" id="s2"><g class="cam" id="cam2"></g></g>
      <g class="scene" id="s3"><g class="cam" id="cam3"></g></g>
      <g class="scene" id="s4"><g class="cam" id="cam4"></g></g>
      <g class="scene" id="s5"><g class="cam" id="cam5"></g></g>
      <g class="scene" id="s6"><g class="cam" id="cam6"></g></g>
      <g class="scene" id="s7"><g class="cam" id="cam7"></g></g>
      <g class="scene" id="s8"><g class="cam" id="cam8"></g></g>
    </g>
    <rect id="flash" width="1080" height="1920" fill="#fff" opacity="0"/>
    <circle id="iris" cx="540" cy="900" r="3300" fill="none" stroke="#000" stroke-width="4000"/>
  </svg>
  <div id="caps"></div>
</div>

<script>
(async () => {
  const P = window.__props;
  for (const [k, v] of Object.entries(P.palette)) document.documentElement.style.setProperty(`--${k}`, v);
  const INK = P.palette.ink;
  const $ = (s) => document.querySelector(s);
  const NS = "http://www.w3.org/2000/svg";
  const cues = [];
  const cue = (at, sfx) => cues.push({ at: +at.toFixed(3), sfx });
  let seed = 7;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;

  // ---------- the cast: an original masked party guest ----------
  // Local origin = between the feet. Body 300 wide, 420 tall; the mask sits at y≈-290.
  const EGG = "M -150 -70 C -150 -300 -105 -420 0 -420 C 105 -420 150 -300 150 -70 C 150 -18 105 0 0 0 C -105 0 -150 -18 -150 -70 Z";
  const SHADE = "M 60 -405 C 135 -335 150 -210 150 -70 C 150 -22 115 -3 55 0 C 108 -70 122 -250 60 -405 Z";
  const MASK = "M -134 -305 C -95 -348 -35 -338 0 -312 C 35 -338 95 -348 134 -305 C 140 -262 112 -236 72 -240 C 40 -244 20 -262 0 -258 C -20 -262 -40 -244 -72 -240 C -112 -236 -140 -262 -134 -305 Z";
  const VOID = "M -138 -332 C -60 -384 60 -384 138 -332 C 154 -232 112 -132 0 -122 C -112 -132 -154 -232 -138 -332 Z";
  const ACC = {
    tophat: (c) => `<rect x="-72" y="-575" width="144" height="150" rx="10" fill="${INK}"/><rect x="-72" y="-470" width="144" height="26" fill="${c.accent}"/>
                    <ellipse cx="0" cy="-424" rx="124" ry="22" fill="${INK}"/>`,
    partyhat: (c) => `<path d="M -74 -402 L 0 -590 L 74 -402 Z" fill="${c.accent}" stroke="${INK}" stroke-width="8" stroke-linejoin="round"/>
                      <path d="M -50 -462 L 24 -528 M -28 -410 L 50 -478" stroke="${INK}" stroke-width="10" stroke-linecap="round" opacity="0.55"/>
                      <circle cx="0" cy="-596" r="24" fill="#FFF4E0" stroke="${INK}" stroke-width="7"/>`,
    flower: (c) => `<g transform="translate(-92 -392)">${[0, 72, 144, 216, 288].map((a) => `<ellipse rx="22" ry="38" cy="-30" transform="rotate(${a})" fill="${c.accent}" stroke="${INK}" stroke-width="6"/>`).join("")}
                    <circle r="20" fill="#F5C542" stroke="${INK}" stroke-width="6"/></g>`,
    bow: (c) => `<g transform="translate(0 -128)"><path d="M 0 0 L -66 -34 L -66 34 Z M 0 0 L 66 -34 L 66 34 Z" fill="${c.accent}" stroke="${INK}" stroke-width="7" stroke-linejoin="round"/>
                 <circle r="16" fill="${c.accent}" stroke="${INK}" stroke-width="7"/></g>`,
  };
  const arm = (side, c) => {
    const s = side === "L" ? -1 : 1;
    return `<g class="arm${side}">
      <path d="M ${138 * s} -190 Q ${200 * s} -150 ${215 * s} -90" fill="none" stroke="${INK}" stroke-width="46" stroke-linecap="round"/>
      <path d="M ${138 * s} -190 Q ${200 * s} -150 ${215 * s} -90" fill="none" stroke="${c.body}" stroke-width="28" stroke-linecap="round"/>
      <ellipse class="finger" cx="${237 * s}" cy="-56" rx="13" ry="30" transform="rotate(${-38 * s} ${237 * s} -56)" fill="#FFF4E0" stroke="${INK}" stroke-width="6" opacity="0"/>
      <circle cx="${215 * s}" cy="-90" r="30" fill="#FFF4E0" stroke="${INK}" stroke-width="7"/></g>`;
  };
  const guest = (id, c, sil = false) => {
    if (sil) c = { body: INK, dark: INK, mask: INK, feather: INK, accent: INK, acc: c.acc };
    const st = sil ? "#2E1F4A" : INK;
    return `<g id="${id}" class="guest"><g class="sq">
      <ellipse cx="-62" cy="-10" rx="52" ry="24" fill="${INK}"/><ellipse cx="62" cy="-10" rx="52" ry="24" fill="${INK}"/>
      <path d="${EGG}" fill="${c.body}"/>
      <path d="${SHADE}" fill="${c.dark}"/>
      ${sil ? "" : `<ellipse cx="-86" cy="-330" rx="20" ry="44" transform="rotate(20 -86 -330)" fill="#fff" opacity="0.35"/>`}
      <path d="${EGG}" fill="none" stroke="${st}" stroke-width="10"/>
      ${c.acc === "bow" ? ACC.bow(c) : ""}
      ${arm("L", c)}${arm("R", c)}
      <g class="face">
        <g class="mouths">
          <path class="m-smile" d="M -42 -192 Q 0 -150 42 -192" fill="none" stroke="${sil ? "#fff" : INK}" stroke-width="10" stroke-linecap="round"/>
          <g class="m-o" opacity="0"><ellipse cx="0" cy="-176" rx="24" ry="30" fill="${INK}"/><ellipse cx="0" cy="-162" rx="13" ry="9" fill="#E8607A"/></g>
          <g class="m-grin" opacity="0"><path d="M -76 -204 Q 0 -96 76 -204 Z" fill="${INK}" stroke="${INK}" stroke-width="8" stroke-linejoin="round"/>
            <path d="M -60 -198 L 60 -198 L 54 -184 L -54 -184 Z" fill="#fff"/><ellipse cx="0" cy="-138" rx="26" ry="12" fill="#E8607A"/></g>
          <path class="m-frown" d="M -36 -160 Q 0 -196 36 -160" fill="none" stroke="${INK}" stroke-width="10" stroke-linecap="round" opacity="0"/>
        </g>
        <g class="void" opacity="0">
          <path d="${VOID}" fill="#0A0414"/>
          <path d="M -104 -300 L -30 -270 L -96 -252 Z M 104 -300 L 30 -270 L 96 -252 Z" fill="#fff"/>
          <path class="teeth" d="M -96 -210 L -72 -232 L -54 -204 L -32 -236 L -12 -202 L 10 -238 L 30 -202 L 52 -236 L 70 -204 L 94 -230 L 104 -206 Q 0 -110 -96 -210 Z" fill="#fff"/>
        </g>
        <g class="mask">
          <path d="M 112 -298 C 150 -360 138 -446 206 -492 C 198 -428 210 -362 140 -290 Z" fill="${c.feather}" stroke="${st}" stroke-width="7" stroke-linejoin="round"/>
          <path d="${MASK}" fill="${c.mask}" stroke="${st}" stroke-width="9" stroke-linejoin="round"/>
          ${sil ? "" : `<circle cx="0" cy="-300" r="9" fill="${c.feather}" stroke="${INK}" stroke-width="4"/>`}
          <g class="eyes">
            <ellipse cx="-60" cy="-290" rx="31" ry="25" fill="#fff" stroke="${st}" stroke-width="6"/>
            <ellipse cx="60" cy="-290" rx="31" ry="25" fill="#fff" stroke="${st}" stroke-width="6"/>
            <g class="pupils"><circle cx="-60" cy="-288" r="13" fill="${INK}"/><circle cx="60" cy="-288" r="13" fill="${INK}"/></g>
            <rect class="lid" x="-100" y="-322" width="200" height="0" fill="${c.mask}"/>
          </g>
        </g>
        <path class="sweat" d="M 150 -330 q 18 28 0 42 q -18 -14 0 -42 z" fill="#8FD8FF" stroke="${INK}" stroke-width="5" opacity="0"/>
      </g>
      ${c.acc && c.acc !== "bow" ? ACC[c.acc](c) : ""}
    </g></g>`;
  };
  const G = P.guests;

  // ---------- bubble letters (one <g> per letter so each can slam in) ----------
  const measure = document.createElementNS(NS, "text");
  measure.setAttribute("font-family", "Lucky");
  $("#svg").appendChild(measure);
  await document.fonts.load('100px "Lucky"');
  await document.fonts.ready;
  const bubble = (parent, str, cx, base, size, fill, maxW = 960, shadow = 18) => {
    measure.setAttribute("font-size", size); measure.textContent = str;
    let w = measure.getComputedTextLength();
    if (w > maxW) { size *= maxW / w; measure.setAttribute("font-size", size); w = measure.getComputedTextLength(); }
    let x = cx - w / 2;
    const out = [];
    for (const ch of str) {
      measure.textContent = ch;
      const cw = measure.getComputedTextLength();
      const g = document.createElementNS(NS, "g");
      g.setAttribute("class", "L");
      const o = `${(x + cw / 2).toFixed(1)} ${(base - size * 0.36).toFixed(1)}`;
      g.dataset.o = o;
      g.innerHTML = `<text x="${x}" y="${base + shadow}" font-family="Lucky" font-size="${size}" fill="${INK}" stroke="${INK}" stroke-width="${size * 0.09}" stroke-linejoin="round">${ch}</text>` +
        `<text x="${x}" y="${base}" font-family="Lucky" font-size="${size}" fill="${fill}" stroke="${INK}" stroke-width="${size * 0.09}" stroke-linejoin="round" paint-order="stroke">${ch}</text>`;
      parent.appendChild(g); out.push(g);
      x += cw;
    }
    return out;
  };
  const rays = (n, c1, c2, cx = 540, cy = 900, R = 2400) => {
    let s = `<rect x="-600" y="-600" width="2280" height="3120" fill="${c1}"/>`;
    for (let i = 0; i < n; i += 2) {
      const a0 = (i / n) * Math.PI * 2, a1 = ((i + 1) / n) * Math.PI * 2;
      s += `<path d="M ${cx} ${cy} L ${cx + R * Math.cos(a0)} ${cy + R * Math.sin(a0)} L ${cx + R * Math.cos(a1)} ${cy + R * Math.sin(a1)} Z" fill="${c2}"/>`;
    }
    return s;
  };

  // ---------- scene 1: the house on the hill ----------
  {
    let stars = "";
    for (let i = 0; i < 110; i++) stars += `<circle class="${i % 6 ? "" : "tw"}" cx="${(rnd() * 1080) | 0}" cy="${(rnd() * 1250) | 0}" r="${(1.5 + rnd() * 3.5).toFixed(1)}" fill="#FFF4E0" opacity="${(0.4 + rnd() * 0.6).toFixed(2)}"/>`;
    let wins = "";
    const W = [[380, 920], [470, 920], [610, 920], [700, 920], [380, 1050], [700, 1050], [540, 760]];
    W.forEach(([x, y], i) => {
      wins += `<g class="win" data-i="${i}"><rect x="${x - 34}" y="${y - 50}" width="68" height="96" rx="34" fill="var(--gold)" stroke="${INK}" stroke-width="7"/>` +
        `<path class="dancer" d="M ${x - 16} ${y + 46} C ${x - 16} ${y + 10} ${x - 10} ${y - 4} ${x} ${y - 4} C ${x + 10} ${y - 4} ${x + 16} ${y + 10} ${x + 16} ${y + 46} Z" fill="${INK}"/></g>`;
    });
    $("#cam1").innerHTML = `<rect x="-200" y="-200" width="1480" height="2320" fill="url(#sky)"/>${stars}
      <mask id="moonCut"><rect x="600" y="100" width="460" height="460" fill="#fff"/><circle cx="880" cy="290" r="110" fill="#000"/></mask><g id="moon" mask="url(#moonCut)"><circle cx="830" cy="330" r="120" fill="#FFF4E0" stroke="${INK}" stroke-width="8"/></g>
      <path d="M -200 1330 Q 300 1180 540 1190 Q 800 1180 1280 1330 L 1280 2200 L -200 2200 Z" fill="#120A30" stroke="${INK}" stroke-width="8"/>
      <g id="house">
        <rect x="290" y="840" width="500" height="380" fill="#2B1A55" stroke="${INK}" stroke-width="9"/>
        <path d="M 260 850 L 540 640 L 820 850 Z" fill="#1F1240" stroke="${INK}" stroke-width="9" stroke-linejoin="round"/>
        <rect x="470" y="560" width="140" height="300" fill="#2B1A55" stroke="${INK}" stroke-width="9"/>
        <path d="M 450 570 L 540 450 L 630 570 Z" fill="#1F1240" stroke="${INK}" stroke-width="9" stroke-linejoin="round"/>
        <path d="M 540 450 L 540 400 M 540 400 L 580 414 L 540 428" stroke="${INK}" stroke-width="7" fill="var(--red)"/>
        <rect x="500" y="1090" width="80" height="130" rx="40" fill="var(--gold)" stroke="${INK}" stroke-width="7"/>
        ${wins}
      </g>
      <g id="notes">${[0, 1, 2].map((i) => `<text class="note" x="${300 + i * 230}" y="700" font-family="Lucky" font-size="90" fill="var(--gold)" stroke="${INK}" stroke-width="7" paint-order="stroke" opacity="0">♪</text>`).join("")}</g>`;
  }

  // ---------- scene 2: the ballroom ----------
  {
    const VP = [540, 760], Y0 = 1180, Y1 = 2000;
    let floor = `<rect x="-200" y="${Y0}" width="1480" height="900" fill="var(--floorA)"/>`;
    const xs = [];
    for (let b = -3400; b <= 4500; b += 300) xs.push(b);
    const ys = [];
    for (let k = 0, y = Y0; y < Y1; k++) { ys.push(y); y += 40 + k * 30; }
    ys.push(Y1 + 200);
    const xAt = (b, y) => VP[0] + (b - VP[0]) * (y - VP[1]) / (1920 - VP[1]);
    for (let r = 0; r < ys.length - 1; r++) for (let c = 0; c < xs.length - 1; c++) if ((r + c) % 2 === 0) {
      const [ya, yb] = [ys[r], ys[r + 1]];
      floor += `<path d="M ${xAt(xs[c], ya)} ${ya} L ${xAt(xs[c + 1], ya)} ${ya} L ${xAt(xs[c + 1], yb)} ${yb} L ${xAt(xs[c], yb)} ${yb} Z" fill="var(--floorB)"/>`;
    }
    const pil = [-120, 200, 880, 1200].map((x) => `<rect x="${x - 40}" y="300" width="80" height="${Y0 - 300}" fill="var(--gold)" stroke="${INK}" stroke-width="8"/>`).join("");
    const curtain = (x, s) => `<path d="M ${x} 0 L ${x + 280 * s} 0 Q ${x + 180 * s} 500 ${x + 60 * s} 1180 L ${x} 1180 Z" fill="var(--red2)" stroke="${INK}" stroke-width="9"/>`;
    $("#cam2").innerHTML = `<rect x="-300" y="-200" width="1680" height="${Y0 + 200}" fill="var(--wall)"/>
      ${[0, 1, 2, 3, 4, 5, 6].map((i) => `<rect x="${-260 + i * 240}" y="380" width="160" height="640" rx="80" fill="var(--wall2)"/>`).join("")}
      ${pil}${curtain(-300, 1)}${curtain(1380, -1)}
      <g id="chand"><path d="M 540 0 L 540 170" stroke="${INK}" stroke-width="8"/>
        <path d="M 400 200 Q 540 290 680 200" fill="none" stroke="var(--gold)" stroke-width="16"/><path d="M 400 200 Q 540 290 680 200" fill="none" stroke="${INK}" stroke-width="5"/>
        ${[400, 470, 540, 610, 680].map((x, i) => `<rect x="${x - 10}" y="${170 + Math.abs(i - 2) * -6}" width="20" height="40" fill="#FFF4E0" stroke="${INK}" stroke-width="5"/>
          <ellipse class="flame" cx="${x}" cy="${156 + Math.abs(i - 2) * -6}" rx="11" ry="18" fill="var(--gold)"/>`).join("")}
        <circle id="glowC" cx="540" cy="200" r="260" fill="var(--gold)" opacity="0.12"/></g>
      ${floor}
      <g id="row">${guest("g2b", G.violet)}${guest("g2c", G.teal)}${guest("g2a", G.crimson)}${guest("g2d", G.mustard)}</g>`;
  }

  // ---------- scene 3: lights out ----------
  {
    const pairs = [[260, 760, 1.0], [800, 700, 0.9], [380, 1130, 1.25], [760, 1180, 1.15]];
    $("#cam3").innerHTML = `<rect x="-200" y="-200" width="1480" height="2320" fill="#05020C"/><rect id="redflick" x="-200" y="-200" width="1480" height="2320" fill="var(--red2)" opacity="0"/>` +
      pairs.map(([x, y, s], i) => `<g class="ep" id="ep${i}" transform="translate(${x} ${y}) scale(${s})"><g class="epi">
        <ellipse cx="-50" cy="0" rx="36" ry="28" fill="#fff"/><ellipse cx="50" cy="0" rx="36" ry="28" fill="#fff"/>
        <g class="pp"><circle cx="-50" cy="2" r="14" fill="#05020C"/><circle cx="50" cy="2" r="14" fill="#05020C"/></g></g></g>`).join("");
  }

  // ---------- scene 4: "¿YO?" ----------
  $("#cam4").innerHTML = `<rect x="-300" y="-300" width="1680" height="2520" fill="url(#stripes)" id="str4"/><g id="t4"></g>${guest("g4", G.teal)}`;
  const L4 = bubble($("#t4"), P.punch.yo, 540, 640, 400, P.palette.gold, 880);
  // ---------- scene 5: "¿TÚ?" ----------
  $("#cam5").innerHTML = `<g id="burst5">${rays(28, P.palette.red, P.palette.red2)}</g><g id="t5"></g>${guest("g5", G.crimson)}`;
  const L5 = bubble($("#t5"), P.punch.tu, 610, 600, 380, "#FFF4E0", 820);
  // ---------- scene 6: title splash ----------
  {
    let conf = "";
    const CC = [P.palette.gold, "#FFF4E0", P.palette.pink, "#2CC4B0", "#8A55E0"];
    for (let i = 0; i < 60; i++) conf += `<rect class="cf" x="-9" y="-16" width="18" height="32" rx="4" fill="${CC[i % 5]}" stroke="${INK}" stroke-width="4"/>`;
    $("#cam6").innerHTML = `<rect x="-300" y="-300" width="1680" height="2520" fill="var(--red)"/>
      <g id="emb"><g transform="translate(540 1150) scale(2.6) translate(0 300)">
        <path d="M 112 -298 C 150 -360 138 -446 206 -492 C 198 -428 210 -362 140 -290 Z" fill="${P.palette.cream}" stroke="${INK}" stroke-width="4"/>
        <path d="M -112 -298 C -150 -360 -138 -446 -206 -492 C -198 -428 -210 -362 -140 -290 Z" fill="${P.palette.cream}" stroke="${INK}" stroke-width="4"/>
        <path d="${MASK}" fill="${P.palette.gold}" stroke="${INK}" stroke-width="4"/>
        <ellipse cx="-60" cy="-290" rx="31" ry="25" fill="var(--red2)" stroke="${INK}" stroke-width="3"/><ellipse cx="60" cy="-290" rx="31" ry="25" fill="var(--red2)" stroke="${INK}" stroke-width="3"/>
      </g></g>
      <g id="t6"></g>
      ${guest("g6a", G.violet, true)}${guest("g6b", G.mustard, true)}${guest("g6c", G.teal, true)}
      <g id="conf">${conf}</g>`;
  }
  const t6 = P.punch.title;
  const L6 = [bubble($("#t6"), t6[0], 540, 500, 230, "#FFF4E0", 880), bubble($("#t6"), t6[1], 540, 660, 140, P.palette.gold, 880), bubble($("#t6"), t6[2], 540, 880, 230, "#FFF4E0", 820)];
  // ---------- scene 7: the mask falls ----------
  {
    let spikes = "";
    for (let i = 0; i < 26; i++) {
      const a = (i / 26) * Math.PI * 2, b = a + Math.PI / 26, R = 2200, r = 420;
      spikes += `<path d="M ${540 + r * Math.cos(a)} ${1000 + r * Math.sin(a)} L ${540 + R * Math.cos(b)} ${1000 + R * Math.sin(b)} L ${540 + r * Math.cos(a + Math.PI / 13)} ${1000 + r * Math.sin(a + Math.PI / 13)} Z" fill="#0A0414"/>`;
    }
    $("#cam7").innerHTML = `<rect x="-300" y="-300" width="1680" height="2520" fill="url(#spot)"/>
      <path d="M 340 -100 L 740 -100 L 1180 2100 L -100 2100 Z" fill="#fff" opacity="0.07"/>
      <g id="horror" opacity="0"><rect x="-300" y="-300" width="1680" height="2520" fill="var(--red2)"/><g id="spk">${spikes}</g></g>
      ${guest("g7", G.violet)}`;
  }
  // ---------- scene 8: the host ----------
  $("#cam8").innerHTML = `<g id="burst8">${rays(24, P.palette.green, P.palette.green2, 540, 820)}</g>${guest("g8", G.mustard)}`;

  // captions
  $("#caps").innerHTML = P.lyrics.map((l, i) => `<div class="cap" id="cap${i}"${l.top ? ` style="top:${l.top}px"` : ""}>${l.words.map(([w]) => `<span>${w}</span>`).join("")}</div>`).join("");

  // ---------- timeline ----------
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });
  const D = P.duration;
  const CUTS = [0, 2, 4, 5.5, 7, 8.5, 11, 13, D];
  gsap.set(".scene", { visibility: "hidden" });
  CUTS.slice(0, -1).forEach((t, i) => {
    tl.set(`#s${i + 1}`, { visibility: "visible" }, t);
    tl.set(`#s${i + 1}`, { visibility: "hidden" }, CUTS[i + 1]);
  });
  // guest rig helpers
  const place = (id, x, y, s, flip = false) => gsap.set(`#${id}`, { x, y, scaleX: flip ? -s : s, scaleY: s, svgOrigin: "0 0" });
  gsap.set(".sq", { svgOrigin: "0 0" });
  gsap.set(".armL", { svgOrigin: "-138 -190" });
  gsap.set(".armR", { svgOrigin: "138 -190" });
  gsap.set(".L", { svgOrigin: (i, el) => el.dataset.o });
  const mouth = (id, state, at) => ["smile", "o", "grin", "frown"].forEach((m) => tl.set(`#${id} .m-${m}`, { opacity: m === state ? 1 : 0 }, at));
  const look = (id, dx, dy, at, dur = 0.12) => tl.to(`#${id} .pupils`, { x: dx, y: dy, duration: dur, ease: "power2.out" }, at);
  const armTo = (id, side, deg, at, dur = 0.12, ease = "back.out(2)") => tl.to(`#${id} .arm${side}`, { rotation: deg, duration: dur, ease }, at);
  const finger = (id, side, on, at) => tl.set(`#${id} .arm${side} .finger`, { opacity: on ? 1 : 0 }, at);
  const bob = (id, at, amt = 0.06) => {
    tl.to(`#${id} .sq`, { scaleY: 1 - amt, scaleX: 1 + amt, duration: 0.06, ease: "power2.out" }, at);
    tl.to(`#${id} .sq`, { scaleY: 1, scaleX: 1, duration: 0.3, ease: "elastic.out(1,0.45)" }, at + 0.06);
  };
  const blink = (id, at) => {
    tl.to(`#${id} .lid`, { attr: { height: 64 }, duration: 0.05, ease: "power1.in" }, at);
    tl.to(`#${id} .lid`, { attr: { height: 0 }, duration: 0.08, ease: "power1.out" }, at + 0.06);
  };
  const shake = (sel, at, dur, amp) => {
    const n = Math.round(dur / 0.035);
    for (let i = 0; i < n; i++) tl.to(sel, { x: (rnd() - 0.5) * 2 * amp, y: (rnd() - 0.5) * 2 * amp, duration: 0.035, ease: "none" }, at + i * 0.035);
    tl.to(sel, { x: 0, y: 0, duration: 0.05 }, at + n * 0.035);
  };
  const slam = (letters, at, step = 0.09, from = 2.6) => letters.forEach((g, i) => {
    tl.fromTo(g, { scale: from, rotation: (i % 2 ? 14 : -14), opacity: 0 }, { scale: 1, rotation: (i % 2 ? 3 : -3), opacity: 1, duration: 0.22, ease: "back.out(2.2)", immediateRender: false }, at + i * step);
    tl.set(g, { opacity: 0 }, 0);
  });
  // captions: words pop on their times, the line holds until the scene cuts
  P.lyrics.forEach((l, i) => {
    const s0 = CUTS[l.scene - 1], s1 = CUTS[l.scene];
    tl.set(`#cap${i}`, { visibility: "visible" }, Math.min(s0, l.words[0][1]));
    tl.set(`#cap${i}`, { visibility: "hidden" }, Math.min(s1, D - 0.3));
    document.querySelectorAll(`#cap${i} span`).forEach((sp, k) => {
      tl.set(sp, { opacity: 0 }, 0);
      tl.fromTo(sp, { opacity: 0, scale: 0.4, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.2, ease: "back.out(3)", immediateRender: false }, l.words[k][1]);
    });
  });
  // line boil on 12s, a stepped seed
  const boilProxy = { f: 0 };
  tl.to(boilProxy, { f: D * 12, duration: D, ease: "none", onUpdate: () => $("#turb").setAttribute("seed", 1 + (Math.floor(boilProxy.f) % 4)) }, 0);

  // 1 — night (0–2): push in, the house bounces on every beat, dancers in the windows
  tl.fromTo("#cam1", { scale: 1, svgOrigin: "540 1000" }, { scale: 1.16, svgOrigin: "540 1000", duration: 2, ease: "sine.inOut" }, 0);
  for (let b = 0; b < 4; b++) {
    const t = b * 0.5;
    tl.to("#house", { scaleY: 1.05, scaleX: 0.97, svgOrigin: "540 1220", duration: 0.07, ease: "power2.out" }, t);
    tl.to("#house", { scaleY: 1, scaleX: 1, svgOrigin: "540 1220", duration: 0.35, ease: "elastic.out(1,0.4)" }, t + 0.07);
    tl.set(".dancer", { x: b % 2 ? 6 : -6, scaleY: b % 2 ? 0.9 : 1, svgOrigin: "0 0" }, t);
    tl.set(".tw", { opacity: b % 2 ? 0.3 : 1 }, t);
  }
  document.querySelectorAll(".note").forEach((n, i) => {
    tl.fromTo(n, { opacity: 0, y: 0 }, { opacity: 1, y: -160, duration: 0.6, ease: "sine.out", immediateRender: false }, 0.2 + i * 0.45);
    tl.to(n, { opacity: 0, duration: 0.2 }, 0.8 + i * 0.45);
  });

  // 2 — ballroom (2–4): pan across a row of guests who side-eye each other
  place("g2b", 340, 1430, 0.78); place("g2c", 790, 1450, 0.8, true);
  place("g2a", 200, 1800, 1.0); place("g2d", 900, 1830, 1.02, true);
  tl.fromTo("#cam2", { x: 90, scale: 1.08, svgOrigin: "540 1300" }, { x: -90, scale: 1.12, svgOrigin: "540 1300", duration: 2, ease: "none" }, 2);
  ["g2a", "g2b", "g2c", "g2d"].forEach((id, i) => {
    for (let b = 0; b < 4; b++) bob(id, 2 + b * 0.5 + (i % 2) * 0.25, 0.05);
    look(id, -18, 0, 2);
    look(id, 18, 0, 2.5 + i * 0.12);
    look(id, -18, 2, 3.25 + (i % 2) * 0.12);
    mouth(id, "frown", 2);
  });
  armTo("g2d", "L", 40, 2.6); armTo("g2d", "L", 0, 3.2);
  blink("g2b", 2.7); blink("g2c", 3.4);
  // the chandelier flickers out on the way into the dark
  tl.set(".flame", { opacity: 0 }, 3.82); tl.set(".flame", { opacity: 1 }, 3.88); tl.set(".flame", { opacity: 0 }, 3.94);
  tl.set("#glowC", { opacity: 0 }, 3.82);
  tl.to("#cam2", { filter: "brightness(0.35)", duration: 0.12, ease: "none" }, 3.85);
  cue(3.85, "click");

  // 3 — dark (4–5.5): only eyes; they blink and dart on the beat; a red flicker
  document.querySelectorAll(".epi").forEach((e, i) => {
    tl.fromTo(e, { scaleY: 0.05, svgOrigin: "0 0" }, { scaleY: 1, svgOrigin: "0 0", duration: 0.12, ease: "power2.out", immediateRender: false }, 4.05 + i * 0.12);
    tl.set(e, { scaleY: 0.05, svgOrigin: "0 0" }, 0);
    [[-14, 0], [14, -4], [0, 6]].forEach(([dx, dy], k) => tl.to(e.querySelector(".pp"), { x: dx * (i % 2 ? -1 : 1), y: dy, duration: 0.08, ease: "power2.out" }, 4.5 + k * 0.33 + i * 0.03));
    tl.to(e, { scaleY: 0.1, svgOrigin: "0 0", duration: 0.05, yoyo: true, repeat: 1, ease: "power1.in" }, 4.9 + i * 0.07);
  });
  tl.set("#redflick", { opacity: 0.55 }, 4.75); tl.set("#redflick", { opacity: 0 }, 4.82);
  tl.set("#redflick", { opacity: 0.4 }, 4.9); tl.set("#redflick", { opacity: 0 }, 4.96);

  // 4 — "¿YO?" (5.5–7): letters slam in, guest points at itself, sweats
  place("g4", 690, 2140, 3.3, true);
  tl.fromTo("#str4", { x: 0 }, { x: -240, duration: 1.5, ease: "none" }, 5.5);
  slam(L4, 5.55, 0.08);
  L4.forEach((_, i) => cue(5.55 + i * 0.08, "pop"));
  mouth("g4", "o", 5.5);
  tl.set("#g4 .pupils", { scale: 0.7, svgOrigin: "0 -288" }, 5.5);
  armTo("g4", "R", 100, 5.75, 0.14); finger("g4", "R", true, 5.75);
  tl.fromTo("#g4 .sweat", { opacity: 0, y: -20 }, { opacity: 1, y: 30, duration: 0.6, ease: "power1.in", immediateRender: false }, 5.9);
  tl.fromTo("#cam4", { scale: 1, svgOrigin: "540 1100" }, { scale: 1.07, svgOrigin: "540 1100", duration: 0.12, ease: "power3.out", immediateRender: false }, 6.0);
  tl.to("#cam4", { scale: 1.03, svgOrigin: "540 1100", duration: 0.4, ease: "power2.out" }, 6.12);
  bob("g4", 6.0, 0.05); bob("g4", 6.5, 0.05);
  look("g4", -10, 0, 6.25, 0.08); look("g4", 10, 0, 6.5, 0.08);

  // 5 — "¿TÚ?" (7–8.5): whip pan in, the accuser jabs on every beat
  place("g5", 330, 2090, 3.0);
  tl.fromTo("#cam5", { x: 700 }, { x: 0, duration: 0.22, ease: "expo.out", immediateRender: false }, 7.0);
  cue(7.0, "whoosh");
  tl.to("#burst5", { rotation: 18, svgOrigin: "540 900", duration: 1.5, ease: "none" }, 7.0);
  armTo("g5", "R", -52, 7.0, 0.01); finger("g5", "R", true, 7.0);
  mouth("g5", "grin", 7.0); look("g5", 16, 0, 7.0, 0.01);
  for (let b = 0; b < 3; b++) {
    tl.to("#g5 .armR", { rotation: -46, duration: 0.06, ease: "power2.out" }, 7.25 + b * 0.5);
    tl.to("#g5 .armR", { rotation: -52, duration: 0.2, ease: "back.out(3)" }, 7.31 + b * 0.5);
    bob("g5", 7.25 + b * 0.5, 0.04);
  }
  slam(L5, 7.75, 0.07, 3.0);
  L5.forEach((_, i) => cue(7.75 + i * 0.07, "pop"));
  shake("#cam5", 7.75, 0.25, 14);

  // 6 — title splash (8.5–11): hit-zoom, letters wave on the beat, silhouettes, confetti
  place("g6a", 150, 2010, 1.45); place("g6b", 930, 2030, 1.5, true); place("g6c", 540, 2080, 1.7);
  tl.fromTo("#cam6", { scale: 1.35, svgOrigin: "540 900" }, { scale: 1, svgOrigin: "540 900", duration: 0.45, ease: "back.out(1.6)", immediateRender: false }, 8.5);
  cue(8.5, "thud");
  tl.fromTo("#emb", { rotation: -8, scale: 0.6, svgOrigin: "540 1180" }, { rotation: 0, scale: 1, svgOrigin: "540 1180", duration: 0.6, ease: "back.out(2)", immediateRender: false }, 8.5);
  slam(L6[0], 8.55, 0.05, 2.2); slam(L6[1], 8.9, 0.06, 2.2); slam(L6[2], 9.0, 0.05, 2.2);
  const all6 = [...L6[0], ...L6[1], ...L6[2]];
  for (let b = 0; b < 4; b++) {
    const t = 9.5 + b * 0.5;
    all6.forEach((g, i) => tl.to(g, { y: (i + b) % 2 ? -18 : 18, rotation: (i + b) % 2 ? 4 : -4, duration: 0.08, ease: "power2.out" }, t));
    tl.to("#emb", { scale: 1.04, svgOrigin: "540 1180", duration: 0.06, yoyo: true, repeat: 1, ease: "power2.out" }, t);
    ["g6a", "g6b", "g6c"].forEach((id) => bob(id, t, 0.05));
  }
  ["g6a", "g6b", "g6c"].forEach((id) => { look(id, 0, -10, 8.5, 0.01); mouth(id, "smile", 8.5); });
  document.querySelectorAll(".cf").forEach((c) => {
    const ang = -Math.PI / 2 + (rnd() - 0.5) * 2.4, sp = 900 + rnd() * 1000;
    const vx = Math.cos(ang) * sp, vy = Math.sin(ang) * sp, T6 = 2.4;
    const xs = 540 + vx * 0.6, apex = 900 + vy * 0.35;
    tl.set(c, { x: 540, y: 900, rotation: rnd() * 360, opacity: 0 }, 0);
    tl.set(c, { opacity: 1 }, 8.5);
    tl.to(c, { x: 540 + vx * 1.2, duration: T6, ease: "power2.out" }, 8.5);
    tl.to(c, { y: apex, duration: 0.5, ease: "power2.out" }, 8.5);
    tl.to(c, { y: 2100 + rnd() * 300, duration: T6 - 0.5, ease: "power1.in" }, 9.0);
    tl.to(c, { rotation: `+=${(rnd() - 0.5) * 1440}`, scaleX: 0.3, duration: T6, ease: "none" }, 8.5);
  });

  // 7 — the mask falls (11–13): nervous, the mask tips and drops, silence, then the hit
  place("g7", 540, 2200, 3.4);
  tl.fromTo("#cam7", { scale: 1, svgOrigin: "540 1100" }, { scale: 1.08, svgOrigin: "540 1100", duration: 0.75, ease: "sine.in", immediateRender: false }, 11.0);
  look("g7", -12, 0, 11.0, 0.01); look("g7", 12, 0, 11.25, 0.08); look("g7", 0, 8, 11.5, 0.08);
  mouth("g7", "frown", 11.0);
  tl.fromTo("#g7 .sweat", { opacity: 0, y: -10 }, { opacity: 1, y: 30, duration: 0.5, ease: "power1.in", immediateRender: false }, 11.1);
  tl.to("#g7 .mask", { rotation: -14, svgOrigin: "134 -305", duration: 0.25, ease: "back.out(3)" }, 11.5);
  cue(11.5, "click");
  tl.set("#g7 .void", { opacity: 1 }, 11.75);
  tl.set("#g7 .mouths", { opacity: 0 }, 11.75);
  tl.to("#g7 .mask", { y: 900, rotation: -60, svgOrigin: "134 -305", duration: 0.5, ease: "power2.in" }, 11.75);
  cue(11.6, "fall");
  // HIT
  tl.set("#horror", { opacity: 1 }, 12.0);
  tl.set("#flash", { opacity: 1 }, 12.0); tl.set("#flash", { opacity: 0 }, 12.05);
  tl.set("#svg", { filter: "invert(1)" }, 12.25); tl.set("#svg", { filter: "none" }, 12.3);
  tl.set("#flash", { opacity: 0.8 }, 12.5); tl.set("#flash", { opacity: 0 }, 12.54);
  tl.fromTo("#cam7", { scale: 1.3, svgOrigin: "540 1100" }, { scale: 1.12, svgOrigin: "540 1100", duration: 1.0, ease: "power2.out", immediateRender: false }, 12.0);
  tl.to("#spk", { rotation: 20, svgOrigin: "540 1000", duration: 1.0, ease: "none" }, 12.0);
  tl.fromTo("#g7 .teeth", { scaleY: 0.4, svgOrigin: "0 -210" }, { scaleY: 1.25, svgOrigin: "0 -210", duration: 0.5, ease: "back.out(3)", immediateRender: false }, 12.0);
  shake("#cam7", 12.0, 0.6, 26);
  cue(12.0, "thud");

  // 8 — host (13–15): green burst, finger up, shrug, iris-out on the final chord
  place("g8", 540, 1960, 2.5);
  tl.to("#burst8", { rotation: -30, svgOrigin: "540 820", duration: 2, ease: "none" }, 13.0);
  mouth("g8", "grin", 13.0); look("g8", 0, 4, 13.0, 0.01);
  armTo("g8", "R", -100, 13.0, 0.01); finger("g8", "R", true, 13.0);
  bob("g8", 13.0, 0.05); bob("g8", 13.5, 0.05);
  tl.to("#g8", { rotation: 6, svgOrigin: "0 0", duration: 0.12, ease: "back.out(2)" }, 13.5);
  // pose B: shrug
  tl.set("#g8", { rotation: -4 }, 14.0);
  armTo("g8", "R", -60, 14.0, 0.01); finger("g8", "R", false, 14.0);
  armTo("g8", "L", 60, 14.0, 0.01);
  mouth("g8", "smile", 14.0);
  bob("g8", 14.0, 0.06);
  blink("g8", 14.3);
  tl.set("#g8", { rotation: 0 }, 14.5);
  mouth("g8", "grin", 14.5); bob("g8", 14.5, 0.08);
  tl.fromTo("#iris", { attr: { r: 3300 } }, { attr: { r: 2000 + 170 }, duration: 0.25, ease: "power3.in", immediateRender: false }, 14.5);
  tl.to("#iris", { attr: { r: 2000 }, duration: 0.15, ease: "power2.in" }, 14.8);
  tl.set("#iris", { attr: { cx: 540, cy: 920 } }, 0);
  cue(14.5, "pop");
  tl.set({}, {}, D);

  window.__seek = (t) => { tl.totalTime(Math.min(t, tl.duration())); };
  window.__meta = { width: 1080, height: 1920, duration: D, cues: cues.sort((a, b) => a.at - b.at), sfx: P.sfx,
                    music: { ...P.music } };
  window.__check = () => {
    const out = [];
    P.lyrics.forEach((l, i) => {
      window.__seek(l.words[l.words.length - 1][1] + 0.3);
      document.querySelectorAll(`#cap${i} span`).forEach((el) => {
        const r = el.getBoundingClientRect();
        if (r.left < 40 || r.right > 1040) out.push(`caption "${el.textContent}" spans ${r.left | 0}–${r.right | 0}px`);
      });
    });
    window.__seek(0);
    return out;
  };
  window.__seek(0);
  window.__resolveReady();
})();
window.__ready = new Promise((r) => (window.__resolveReady = r));
</script>
