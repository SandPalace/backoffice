<!doctype html>
<!--
  Mascot Explainer — a 15 s vertical cartoon explainer with an original cute character, built from
  SVG primitives and animated with GSAP (rendered by render/gsap/render.mjs).
  The mascot is "your own agent": a round, flat creature with an antenna. It acts the message:
    A  hook    hops in, looks up at the headline, turns and says the payoff in a speech bubble
    B  shift   gets buried in "?" bubbles (dizzy), shakes them off, a tie pops on: now it works for you
    C  proof   catches one task card per beat; each gets a check
    D  offer   points at the CTA, presses it, waves
  Copy, palette and sound come from window.__props. One paused timeline, nothing on wall-clock time.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mascot Explainer</title>
<style>
  @font-face { font-family: "Display"; src: url("../../../tesseract/fonts/dmsans/DMSans-Bold.ttf"); font-weight: 700; }
  @font-face { font-family: "Body"; src: url("../../../tesseract/fonts/inter/Inter-Medium.ttf"); font-weight: 500; }
  @font-face { font-family: "Body"; src: url("../../../tesseract/fonts/inter/Inter-SemiBold.ttf"); font-weight: 600; }
  :root { --paper: #F5EFE3; --ink: #181818; --accent: #D97757; --accent-dark: #B85F42; --blush: #F0A58C; --signal: #6A9BCC; --card: #FFFDF8; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); font-family: "Body"; color: var(--ink); }
  .layer { position: absolute; inset: 0; }
  svg.full { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: visible; }
  .display { font-family: "Display"; font-weight: 700; letter-spacing: -0.035em; line-height: 0.95; }
  .mask { overflow: hidden; display: block; padding-bottom: 0.1em; margin-bottom: -0.1em; }
  .mask > span { display: inline-block; }
  .blk { position: absolute; left: 64px; right: 64px; visibility: hidden; }
  #meta { position: absolute; left: 64px; right: 64px; top: 210px; display: flex; justify-content: space-between;
          font-size: 26px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; z-index: 5; }
  .acc { color: var(--accent); }
  .card { position: absolute; width: 456px; height: 214px; background: var(--card); border: 5px solid var(--ink); border-radius: 34px;
          display: flex; align-items: center; gap: 22px; padding: 0 26px; visibility: hidden; box-shadow: 0 10px 0 var(--ink); }
  .card svg { flex: 0 0 92px; width: 92px; height: 92px; }
  .card p { font-size: 36px; font-weight: 600; line-height: 1.12; }
  .card .ok { position: absolute; right: -18px; top: -18px; width: 64px; height: 64px; border-radius: 50%; background: var(--accent);
              border: 5px solid var(--ink); display: flex; align-items: center; justify-content: center; }
  #btn { position: absolute; left: 64px; top: 880px; width: 952px; height: 124px; border-radius: 62px; background: var(--ink); color: var(--paper);
         display: flex; align-items: center; justify-content: center; gap: 22px; font-size: 42px; font-weight: 600; visibility: hidden;
         box-shadow: 0 10px 0 var(--accent); }
  #btn .num { color: var(--accent); }
  #info { position: absolute; left: 64px; right: 64px; top: 660px; visibility: hidden; border-top: 3px solid var(--ink); padding-top: 22px; }
  #info .l1 { font-size: 50px; font-weight: 600; }
  #info .l2 { font-size: 38px; margin-top: 8px; color: #55534C; }
</style>
</head>
<body>
<div id="stage">
  <div id="meta"><span id="metaL"></span><span id="metaR"></span></div>

  <!-- headlines (HTML) -->
  <div class="blk display" id="hA" style="top:330px;font-size:108px"></div>
  <div class="blk display" id="hB1" style="top:330px;font-size:108px"></div>
  <div class="blk display" id="hB2" style="top:330px;font-size:108px"></div>
  <div class="blk display" id="hC" style="top:330px;font-size:84px"></div>
  <div class="blk display" id="hD" style="top:330px;font-size:150px"></div>
  <div id="info"><div class="l1" id="i1"></div><div class="l2" id="i2"></div></div>
  <div id="btn"><span id="btnL"></span><span class="num" id="btnR"></span></div>
  <div id="cards"></div>

  <svg class="full" viewBox="0 0 1080 1920">
    <!-- ground shadow follows the mascot on x, squashes when it is airborne -->
    <ellipse id="shadow" cx="0" cy="0" rx="200" ry="28" fill="var(--ink)" opacity="0.12"/>
    <!-- "?" bubbles of scene B -->
    <g id="qs"></g>
    <!-- speech bubble of scene A -->
    <g id="bubble" style="visibility:hidden">
      <path d="M 120 760 H 960 A 40 40 0 0 1 1000 800 V 960 A 40 40 0 0 1 960 1000 H 600 L 545 1060 L 520 1000 H 120 A 40 40 0 0 1 80 960 V 800 A 40 40 0 0 1 120 760 Z"
            fill="var(--card)" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round"/>
      <text id="bubbleT" x="540" y="912" text-anchor="middle" font-family="Display" font-weight="700" font-size="92" letter-spacing="-3" fill="var(--accent)"></text>
    </g>

    <!-- THE MASCOT. Local origin = between the feet on the ground. -->
    <g id="char">
      <g id="squash">
        <ellipse cx="-62" cy="-18" rx="48" ry="26" fill="var(--ink)"/>
        <ellipse cx="62" cy="-18" rx="48" ry="26" fill="var(--ink)"/>
        <g id="armL"><path d="M -138 -170 L -205 -105" stroke="var(--accent-dark)" stroke-width="34" stroke-linecap="round"/></g>
        <g id="armR"><path d="M 138 -170 L 205 -105" stroke="var(--accent-dark)" stroke-width="34" stroke-linecap="round"/></g>
        <g id="head">
          <line x1="0" y1="-300" x2="0" y2="-362" stroke="var(--ink)" stroke-width="9" stroke-linecap="round"/>
          <circle id="bulb" cx="0" cy="-374" r="17" fill="var(--ink)"/>
          <circle id="glow" cx="0" cy="-374" r="34" fill="var(--signal)" opacity="0"/>
          <rect x="-160" y="-310" width="320" height="282" rx="128" fill="var(--accent)"/>
          <ellipse cx="0" cy="-118" rx="96" ry="60" fill="#E89275" opacity="0.55"/>
          <ellipse cx="-96" cy="-150" rx="22" ry="12" fill="var(--blush)"/>
          <ellipse cx="96" cy="-150" rx="22" ry="12" fill="var(--blush)"/>
          <!-- eyes: three states, swapped by opacity -->
          <g id="eyes">
            <g id="eyesOpen">
              <g id="pupils">
                <ellipse cx="-54" cy="-192" rx="24" ry="32" fill="var(--ink)"/>
                <ellipse cx="54" cy="-192" rx="24" ry="32" fill="var(--ink)"/>
                <circle cx="-46" cy="-204" r="9" fill="#fff"/>
                <circle cx="62" cy="-204" r="9" fill="#fff"/>
              </g>
            </g>
            <g id="eyesHappy" opacity="0">
              <path d="M -78 -186 Q -54 -218 -30 -186 M 30 -186 Q 54 -218 78 -186" fill="none" stroke="var(--ink)" stroke-width="10" stroke-linecap="round"/>
            </g>
            <g id="eyesDizzy" opacity="0">
              <path id="swirlL" d="M -54 -192 m -4 0 a 4 4 0 1 1 8 0 a 9 9 0 1 1 -16 0 a 15 15 0 1 1 30 0 a 21 21 0 1 1 -42 0" fill="none" stroke="var(--ink)" stroke-width="6" stroke-linecap="round"/>
              <path id="swirlR" d="M 54 -192 m -4 0 a 4 4 0 1 1 8 0 a 9 9 0 1 1 -16 0 a 15 15 0 1 1 30 0 a 21 21 0 1 1 -42 0" fill="none" stroke="var(--ink)" stroke-width="6" stroke-linecap="round"/>
            </g>
          </g>
          <path id="smile" d="M -22 -146 Q 0 -124 22 -146" fill="none" stroke="var(--ink)" stroke-width="8" stroke-linecap="round"/>
          <ellipse id="mouthO" cx="0" cy="-138" rx="14" ry="17" fill="var(--ink)" opacity="0"/>
          <path id="sweat" d="M 128 -262 q 14 22 0 32 q -14 -10 0 -32 z" fill="var(--signal)" opacity="0"/>
          <!-- the tie: appears when the agent gets to work -->
          <g id="tie" opacity="0">
            <path d="M -17 -104 L 17 -104 L 10 -90 L -10 -90 Z" fill="var(--ink)"/>
            <path d="M -10 -90 L 10 -90 L 19 -56 L 0 -42 L -19 -56 Z" fill="var(--ink)"/>
          </g>
        </g>
      </g>
    </g>
  </svg>
</div>

<script>
(async () => {
  const P = window.__props, C = P.copy;
  for (const [k, v] of Object.entries(P.palette)) document.documentElement.style.setProperty(`--${k}`, v);
  gsap.registerPlugin(DrawSVGPlugin, CustomEase);
  const $ = (s) => document.querySelector(s);
  const lines = (arr, cls = "") => arr.map((l, i) => `<span class="mask"><span class="${i === arr.length - 1 ? cls : ""}">${l}</span></span>`).join("");
  const cues = [];
  const cue = (at, sfx) => cues.push({ at: +at.toFixed(3), sfx });

  $("#metaL").textContent = C.meta[0]; $("#metaR").textContent = C.meta[1];
  $("#hA").innerHTML = lines(C.hook);
  $("#bubbleT").textContent = C.payoff;
  $("#hB1").innerHTML = lines(C.shift_from);
  $("#hB2").innerHTML = lines(C.shift_to, "acc");
  $("#hC").innerHTML = lines([C.proof_head]);
  $("#hD").innerHTML = lines(C.title);
  $("#i1").textContent = C.info[0]; $("#i2").textContent = C.info[1];
  $("#btnL").textContent = C.cta; $("#btnR").textContent = C.phone;

  // task cards (scene C)
  const ICON = [
    `<rect x="14" y="8" width="64" height="76" rx="8" fill="none" stroke="var(--ink)" stroke-width="6"/><path d="M28 30h36M28 46h36M28 62h22" stroke="var(--accent)" stroke-width="6" stroke-linecap="round"/>`,
    `<rect x="8" y="12" width="76" height="68" rx="8" fill="none" stroke="var(--ink)" stroke-width="6"/><path d="M8 35h76M8 57h76M34 12v68M60 12v68" stroke="var(--accent)" stroke-width="5"/>`,
    `<rect x="8" y="20" width="76" height="54" rx="8" fill="none" stroke="var(--ink)" stroke-width="6"/><path d="M10 24l36 28 36-28" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linejoin="round"/>`,
    `<rect x="16" y="26" width="60" height="52" rx="22" fill="var(--accent)" stroke="var(--ink)" stroke-width="5"/><circle cx="36" cy="50" r="6" fill="var(--ink)"/><circle cx="56" cy="50" r="6" fill="var(--ink)"/><path d="M46 26V12" stroke="var(--ink)" stroke-width="5"/><circle cx="46" cy="10" r="6" fill="var(--ink)"/>`,
  ];
  const POS = [[64, 520], [560, 520], [64, 776], [560, 776]];
  $("#cards").innerHTML = C.proof.map((t, i) =>
    `<div class="card" id="card${i}" style="left:${POS[i][0]}px;top:${POS[i][1]}px"><svg viewBox="0 0 92 92">${ICON[i]}</svg><p>${t}</p>` +
    `<div class="ok"><svg viewBox="0 0 40 40" width="34" height="34"><path class="tick" d="M8 21l8 8 16-17" fill="none" stroke="var(--card)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>`).join("");

  // "?" bubbles (scene B), fixed layout around the head
  const QB = [[230, 880, 1.0], [820, 840, 1.15], [360, 700, 0.8], [700, 680, 0.9], [150, 1080, 0.75], [930, 1060, 0.8], [540, 600, 0.7]];
  $("#qs").innerHTML = QB.map(([x, y, s], i) =>
    `<g class="q" transform="translate(${x} ${y})"><g class="qi" data-s="${s}"><circle r="70" fill="var(--card)" stroke="var(--ink)" stroke-width="6"/>` +
    `<text y="30" text-anchor="middle" font-family="Display" font-weight="700" font-size="92" fill="var(--accent)">?</text></g></g>`).join("");

  await document.fonts.ready;

  // ---------- timeline ----------
  const LEAD = 1.2, T = (x) => x + LEAD;  // every position must stay >= 0
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });
  const S = (id, at, v = "visible") => tl.set(id, { visibility: v }, T(at));
  const reveal = (sel, at, stagger = 0.1) => tl.from(`${sel} .mask > span`, { yPercent: 110, duration: 0.6, stagger, ease: "expo.out" }, T(at));
  const conceal = (sel, at) => tl.to(`${sel} .mask > span`, { yPercent: -110, duration: 0.35, stagger: 0.05, ease: "power3.in" }, T(at));

  // mascot rig helpers (all transforms in the SVG user space)
  const GROUND = 1570, SCALE = 1.4;
  gsap.set("#char", { x: 540, y: GROUND, scale: SCALE, svgOrigin: "0 0" });
  gsap.set("#shadow", { attr: { cx: 540, cy: GROUND - 6 } });
  gsap.set("#squash", { svgOrigin: "0 0" });
  gsap.set("#armL", { svgOrigin: "-138 -170", rotation: 0 });
  gsap.set("#armR", { svgOrigin: "138 -170", rotation: 0 });
  gsap.set(".qi", { scale: 0, svgOrigin: "0 0" });
  const pose = (prop, at, dur = 0.3, ease = "power2.out") => tl.to("#char", { ...prop, duration: dur, ease }, T(at));
  const arm = (id, deg, at, dur = 0.25, ease = "back.out(2)") => tl.to(id, { rotation: deg, duration: dur, ease }, T(at));
  const squash = (at, sx = 1.18, sy = 0.82, dur = 0.09) => {
    tl.to("#squash", { scaleX: sx, scaleY: sy, duration: dur, ease: "power2.out" }, T(at));
    tl.to("#squash", { scaleX: 1, scaleY: 1, duration: 0.45, ease: "elastic.out(1.1,0.4)" }, T(at + dur));
  };
  const hop = (at, x, height = 160, dur = 0.5) => {
    squash(at - 0.08, 1.1, 0.88, 0.08);
    tl.to("#char", { x, duration: dur, ease: "power1.inOut" }, T(at));
    tl.to("#char", { y: GROUND - height, duration: dur / 2, ease: "power2.out" }, T(at));
    tl.to("#char", { y: GROUND, duration: dur / 2, ease: "power2.in" }, T(at + dur / 2));
    tl.to("#shadow", { attr: { cx: x }, duration: dur, ease: "power1.inOut" }, T(at));
    tl.to("#shadow", { attr: { rx: 130 }, duration: dur / 2, yoyo: true, repeat: 1, ease: "power2.out" }, T(at));
    squash(at + dur);
  };
  const eyes = (state, at) => {
    ["Open", "Happy", "Dizzy"].forEach((s) => tl.set(`#eyes${s}`, { opacity: s === state ? 1 : 0 }, T(at)));
  };
  const blink = (at) => {
    tl.to("#eyesOpen", { scaleY: 0.08, svgOrigin: "0 -192", duration: 0.06, ease: "power1.in" }, T(at));
    tl.to("#eyesOpen", { scaleY: 1, svgOrigin: "0 -192", duration: 0.09, ease: "power1.out" }, T(at + 0.06));
  };
  const look = (dx, dy, at, dur = 0.2) => tl.to("#pupils", { x: dx, y: dy, duration: dur, ease: "power2.out" }, T(at));
  const mouth = (o, at) => { tl.set("#mouthO", { opacity: o ? 1 : 0 }, T(at)); tl.set("#smile", { opacity: o ? 0 : 1 }, T(at)); };
  // breathing: a gentle constant idle across the whole spot
  tl.to("#head", { scaleY: 1.025, svgOrigin: "0 -28", duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 29 }, T(0));

  // A — hook (0 – 3.6)
  S("#hA", -1);
  reveal("#hA", -0.35, 0.12);
  tl.fromTo("#char", { y: GROUND + 520 }, { y: GROUND - 120, duration: 0.45, ease: "power2.out" }, T(-0.3));
  tl.to("#char", { y: GROUND, duration: 0.3, ease: "power2.in" }, T(0.15));
  squash(0.45);
  cue(0.45, "land");
  look(0, -14, 0.7); blink(1.05);
  look(10, -14, 1.3, 0.3);
  // turns to us and says the payoff
  look(0, 4, 1.75, 0.15);
  eyes("Happy", 1.8); mouth(true, 1.8);
  arm("#armR", -135, 1.8, 0.3);
  tl.to("#armR", { rotation: -105, duration: 0.18, yoyo: true, repeat: 5, ease: "sine.inOut" }, T(2.1));
  S("#bubble", 1.85);
  tl.from("#bubble", { scale: 0.2, svgOrigin: "540 1060", duration: 0.5, ease: "back.out(1.8)" }, T(1.85));
  cue(1.9, "pop");
  // exit A
  conceal("#hA", 3.3);
  tl.to("#bubble", { scale: 0, svgOrigin: "540 1060", duration: 0.3, ease: "back.in(2)" }, T(3.3));
  arm("#armR", 0, 3.3, 0.25, "power2.inOut");
  eyes("Open", 3.4); mouth(false, 3.4);
  S("#hA", 3.7, "hidden"); S("#bubble", 3.7, "hidden");

  // B — shift (3.6 – 7.4)
  S("#hB1", 3.6);
  reveal("#hB1", 3.6);
  document.querySelectorAll(".qi").forEach((q, i) => {
    const at = 3.9 + i * 0.16;
    tl.to(q, { scale: +q.dataset.s, duration: 0.35, ease: "back.out(2.5)" }, T(at));
    tl.to(q, { rotation: (i % 2 ? 8 : -8), duration: 0.3, yoyo: true, repeat: 3, ease: "sine.inOut" }, T(at + 0.35));
    cue(at, "pop");
  });
  look(-16, -10, 4.0, 0.15); look(16, -12, 4.35, 0.15); look(-10, -16, 4.7, 0.15);
  eyes("Dizzy", 4.95); mouth(true, 4.95);
  tl.to("#swirlL", { rotation: 720, svgOrigin: "-54 -192", duration: 1.2, ease: "none" }, T(4.95));
  tl.to("#swirlR", { rotation: 720, svgOrigin: "54 -192", duration: 1.2, ease: "none" }, T(4.95));
  tl.to("#sweat", { opacity: 1, y: 16, duration: 0.5, ease: "power1.in" }, T(5.0));
  // shake it off
  tl.to("#char", { rotation: 7, svgOrigin: "0 0", duration: 0.07, yoyo: true, repeat: 7, ease: "sine.inOut" }, T(5.6));
  tl.set("#char", { rotation: 0 }, T(6.17));
  tl.to(".qi", { scale: 0, duration: 0.25, stagger: 0.03, ease: "back.in(2.5)" }, T(5.85));
  cue(5.6, "whoosh");
  tl.to("#sweat", { opacity: 0, duration: 0.15 }, T(5.9));
  // gets to work: tie, signal light, determined
  eyes("Open", 6.15); mouth(false, 6.15);
  hop(6.15, 540, 140, 0.42);
  tl.to("#tie", { opacity: 1, duration: 0.01 }, T(6.35));
  tl.from("#tie", { scale: 0, svgOrigin: "0 -90", duration: 0.4, ease: "back.out(3)" }, T(6.35));
  tl.to("#glow", { opacity: 0.85, duration: 0.2, ease: "none" }, T(6.4));
  tl.to("#bulb", { fill: "var(--signal)", duration: 0.2, ease: "none" }, T(6.4));
  cue(6.4, "ping");
  conceal("#hB1", 5.95);
  S("#hB2", 6.38); S("#hB1", 6.38, "hidden");
  reveal("#hB2", 6.4);
  conceal("#hB2", 7.25);
  S("#hB1", 7.6, "hidden"); S("#hB2", 7.6, "hidden");

  // C — proof (7.4 – 11.4): a card per beat; the agent taps it, it gets a check
  S("#hC", 7.45); reveal("#hC", 7.45);
  const targets = [[-125, -40], [125, -40], [-125, -20], [125, -20]];
  C.proof.forEach((_, i) => {
    const at = 8.0 + i * 0.6;
    S(`#card${i}`, at);
    tl.from(`#card${i}`, { y: 80, scale: 0.6, rotation: i % 2 ? 6 : -6, opacity: 0, duration: 0.45, ease: "back.out(1.7)" }, T(at));
    const side = i % 2 ? "#armR" : "#armL";
    look(targets[i][0] / 9, -16, at - 0.05, 0.15);
    arm(side, i % 2 ? -125 : 125, at + 0.15, 0.18);
    arm(side, 0, at + 0.45, 0.25, "power2.inOut");
    tl.from(`#card${i} .ok`, { scale: 0, duration: 0.3, ease: "back.out(3)" }, T(at + 0.3));
    tl.fromTo(`#card${i} .tick`, { drawSVG: "0%" }, { drawSVG: "100%", duration: 0.25, ease: "power2.out" }, T(at + 0.38));
    squash(at + 0.3, 1.06, 0.94, 0.06);
    cue(at + 0.3, "tick");
  });
  blink(10.6);
  eyes("Happy", 10.75); eyes("Open", 11.2);
  // exit C
  tl.to(".card", { y: -60, opacity: 0, duration: 0.3, stagger: 0.04, ease: "power3.in" }, T(11.1));
  conceal("#hC", 11.1);
  cue(11.1, "whoosh");

  // D — offer (11.4 – 15)
  S("#hD", 11.45); reveal("#hD", 11.45, 0.1);
  S("#info", 11.8);
  tl.from("#info", { clipPath: "inset(0 100% 0 0)", duration: 0.6, ease: "power3.inOut" }, T(11.8));
  tl.from("#info > div", { y: 20, opacity: 0, duration: 0.45, stagger: 0.08 }, T(11.95));
  S("#btn", 12.3);
  tl.from("#btn", { scale: 0.3, opacity: 0, duration: 0.5, ease: "back.out(1.8)" }, T(12.3));
  // the agent hops up and presses it
  look(0, -18, 12.3, 0.2);
  arm("#armR", -165, 12.6, 0.2);
  hop(12.7, 540, 45, 0.5);
  tl.to("#btn", { y: 10, boxShadow: "0 0px 0 var(--accent)", duration: 0.08, ease: "power2.in" }, T(12.95));
  tl.to("#btn", { y: 0, boxShadow: "0 10px 0 var(--accent)", duration: 0.25, ease: "back.out(3)" }, T(13.03));
  cue(12.95, "ping");
  arm("#armR", 0, 13.25, 0.3, "power2.inOut");
  eyes("Happy", 13.3); mouth(true, 13.3);
  arm("#armL", 130, 13.6, 0.25);
  tl.to("#armL", { rotation: 100, duration: 0.18, yoyo: true, repeat: 5, ease: "sine.inOut" }, T(13.85));
  tl.set({}, {}, T(P.duration));

  window.__seek = (t) => { tl.totalTime(Math.min(T(t), tl.duration())); };
  window.__meta = { width: 1080, height: 1920, duration: P.duration, cues: cues.sort((a, b) => a.at - b.at), sfx: P.sfx, music: P.music };
  window.__check = () => {
    const out = [];
    for (const [sel, t] of [["#hA .mask > span", 2], ["#hB1 .mask > span", 5], ["#hB2 .mask > span", 7], ["#hC .mask > span", 10],
                            ["#hD .mask > span", 14.5], ["#info > div", 14.5], ["#btn span", 14.5], [".card p", 10.5]]) {
      window.__seek(t);
      document.querySelectorAll(sel).forEach((el) => {
        const r = el.getBoundingClientRect();
        if (r.left < 40 || r.right > 1040) out.push(`${sel} "${el.textContent.slice(0, 30)}" spans ${r.left | 0}–${r.right | 0}px at ${t}s`);
        const card = el.closest(".card");
        if (card && el.scrollHeight > card.clientHeight - 20) out.push(`card text too tall: "${el.textContent}"`);
      });
    }
    window.__seek(0);
    return out;
  };
  window.__seek(0);
  window.__resolveReady();
})();
window.__ready = new Promise((r) => (window.__resolveReady = r));
</script>
</body>
