<!doctype html>
<!--
  Poster Kinetic — a 15 s vertical motion poster, HTML + GSAP, rendered by render/gsap/render.mjs.
  Four scenes on a 120 BPM grid, each a poster composition rather than a text slide:
    A  hook    a giant "?" draws itself; its dot grows into the accent disc behind the payoff line
    B  shift   a split-flap board flips the verb while a Bauhaus tile field rotates in a wave
    C  proof   a giant numeral, a grid of drawn glyphs, one takeaway per beat (ink field)
    D  offer   circle + half-disc poster, rotating ring text, info grid, CTA pill
  Copy, palette and sound come from window.__props (props.json). One paused timeline; no
  wall-clock animation anywhere, so any frame can be rendered by seeking.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Poster Kinetic</title>
<style>
  @font-face { font-family: "Display"; src: url("../../../tesseract/fonts/dmsans/DMSans-Bold.ttf"); font-weight: 700; }
  @font-face { font-family: "Body"; src: url("../../../tesseract/fonts/inter/Inter-Medium.ttf"); font-weight: 500; }
  @font-face { font-family: "Body"; src: url("../../../tesseract/fonts/inter/Inter-SemiBold.ttf"); font-weight: 600; }
  :root { --paper: #F5EFE3; --ink: #181818; --accent: #D97757; --soft: #6C6A62; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--paper);
           font-family: "Body"; color: var(--ink); -webkit-font-smoothing: antialiased; }
  .scene { position: absolute; inset: 0; visibility: hidden; overflow: hidden; }
  .full { position: absolute; inset: 0; width: 1080px; height: 1920px; }
  .display { font-family: "Display"; font-weight: 700; letter-spacing: -0.035em; line-height: 0.92; }
  .caps { font-family: "Body"; font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; }
  .mask { overflow: hidden; display: block; padding-bottom: 0.08em; margin-bottom: -0.08em; }
  .mask > span { display: inline-block; }

  /* persistent header */
  #meta { position: absolute; left: 64px; right: 64px; top: 210px; display: flex; justify-content: space-between;
          font-size: 26px; z-index: 50; color: var(--ink); }

  /* A */
  #A { background: var(--paper); }
  #A .head { position: absolute; left: 64px; top: 420px; font-size: 132px; }

  /* B */
  #B { background: var(--accent); }
  #board { position: absolute; left: 0; right: 0; top: 400px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .row { display: flex; gap: 6px; perspective: 900px; }
  .cell { position: relative; width: 84px; height: 124px; }
  .cell .face { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
                font-family: "Display"; font-weight: 700; font-size: 92px; color: var(--paper); background: var(--ink);
                border-radius: 8px; backface-visibility: hidden; transform-origin: 50% 50%; }
  .cell .face::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 3px; background: var(--accent); opacity: .55; }
  .cell.blank .face { background: transparent; }
  .cell.blank .face::after { display: none; }
  .row.small .cell { width: 62px; height: 92px; }
  .row.small .face { font-size: 66px; }
  #tiles { position: absolute; left: 0; top: 1020px; display: grid; grid-template-columns: repeat(4, 270px); }
  #tiles svg { width: 270px; height: 270px; display: block; }

  /* C */
  #C { background: var(--ink); color: var(--paper); }
  #big4 { position: absolute; left: 40px; top: 300px; font-size: 900px; line-height: 0.8; color: var(--paper); }
  #C .side { position: absolute; left: 600px; top: 470px; font-size: 92px; }
  #C .side .acc { color: var(--accent); }
  #grid { position: absolute; left: 64px; top: 1110px; width: 952px; display: grid; grid-template-columns: 1fr 1fr; }
  #grid .item { height: 210px; display: flex; gap: 26px; align-items: center; padding: 0 12px; }
  #grid .item svg { flex: 0 0 96px; width: 96px; height: 96px; overflow: visible; }
  #grid .item p { font-size: 38px; font-weight: 600; line-height: 1.12; color: var(--paper); }
  #C .hr { position: absolute; height: 2px; background: rgba(245,239,227,.25); transform-origin: 0 50%; }

  /* D */
  #D { background: var(--paper); }
  #D .title { position: absolute; left: 64px; top: 935px; font-size: 150px; }
  #info { position: absolute; left: 64px; top: 1235px; width: 952px; display: grid; grid-template-columns: repeat(3, 1fr);
          border-top: 2px solid var(--ink); }
  #info div { padding: 18px 10px 0 0; font-size: 27px; line-height: 1.3; }
  #info b { display: block; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
  #cta { position: absolute; left: 64px; top: 1380px; width: 952px; height: 118px; border-radius: 59px; background: var(--ink);
         color: var(--paper); display: flex; align-items: center; justify-content: space-between; padding: 0 48px;
         font-size: 40px; font-weight: 600; }
  #cta .num { color: var(--accent); }
</style>
</head>
<body>
<div id="stage">
  <div id="meta" class="caps"><span id="metaL"></span><span id="metaR"></span></div>

  <section id="A" class="scene">
    <svg class="full" viewBox="0 0 1080 1920">
      <path id="qArc" d="M 520 1000 A 260 260 0 1 1 860 1250 Q 760 1300 760 1420 L 760 1470"
            fill="none" stroke="var(--accent)" stroke-width="118" stroke-linecap="butt"/>
      <circle id="qDot" cx="760" cy="1640" r="72" fill="var(--accent)"/>
    </svg>
    <div class="head display" id="aHead"></div>
    <div class="display" id="aPay" style="position:absolute;left:0;right:0;top:1420px;text-align:center;font-size:150px;color:var(--paper)"></div>
  </section>

  <section id="B" class="scene">
    <div id="board"></div>
    <div id="tiles"></div>
  </section>

  <section id="C" class="scene">
    <div id="big4" class="display"><span class="mask"><span id="big4n"></span></span></div>
    <div class="side display"><span class="mask"><span id="cS1"></span></span><span class="mask"><span id="cS2" class="acc"></span></span></div>
    <div class="hr" id="hr1" style="left:64px;top:1110px;width:952px"></div>
    <div class="hr" id="hr2" style="left:64px;top:1320px;width:952px"></div>
    <div class="hr" id="hr3" style="left:64px;top:1530px;width:952px"></div>
    <div id="grid"></div>
  </section>

  <section id="D" class="scene">
    <svg class="full" viewBox="0 0 1080 1920">
      <defs><path id="ring" d="M 820 600 m -312 0 a 312 312 0 1 1 624 0 a 312 312 0 1 1 -624 0"/></defs>
      <path id="half" d="M 0 350 A 250 250 0 0 1 0 850 Z" fill="var(--ink)"/>
      <circle id="sun" cx="820" cy="600" r="250" fill="var(--accent)"/>
      <g id="ringG"><text font-family="Body" font-weight="600" font-size="25" letter-spacing="6" fill="var(--ink)">
        <textPath href="#ring" id="ringText"></textPath></text></g>
    </svg>
    <div class="title display"><span class="mask"><span id="dT1"></span></span><span class="mask"><span id="dT2"></span></span></div>
    <div id="info"></div>
    <div id="cta"><span id="ctaL"></span><span class="num" id="ctaR"></span></div>
  </section>
</div>

<script>
(async () => {
  const P = window.__props;
  const C = P.copy;
  const root = document.documentElement.style;
  for (const [k, v] of Object.entries(P.palette)) root.setProperty(`--${k}`, v);
  gsap.registerPlugin(SplitText, DrawSVGPlugin, CustomEase);
  CustomEase.create("poster", "0.16,1,0.3,1");
  const $ = (s) => document.querySelector(s);
  const cues = [];
  const cue = (at, sfx) => cues.push({ at: +at.toFixed(3), sfx });

  // ---------- copy into the DOM ----------
  $("#metaL").textContent = C.meta[0];
  $("#metaR").textContent = C.meta[1];
  $("#aHead").innerHTML = C.hook.map((l) => `<span class="mask"><span>${l}</span></span>`).join("");
  $("#aPay").innerHTML = `<span class="mask"><span>${C.payoff}</span></span>`;
  $("#big4n").textContent = C.numeral;
  $("#cS1").textContent = C.numeral_side[0];
  $("#cS2").textContent = C.numeral_side[1];
  $("#dT1").textContent = C.title[0];
  $("#dT2").textContent = C.title[1];
  $("#ctaL").textContent = C.cta;
  $("#ctaR").textContent = C.phone;
  $("#info").innerHTML = C.info.map(([a, b]) => `<div><b>${a}</b>${b}</div>`).join("");
  const ringUnit = C.ring + " · ";
  $("#ringText").textContent = ringUnit.repeat(Math.ceil(110 / ringUnit.length));

  // split-flap board: each row flips `from` → `to`, padded to the same width
  const board = $("#board");
  const flaps = [];
  C.flap.forEach((r, ri) => {
    const n = Math.max(r.from.length, r.to.length);
    const pad = (s) => { const k = n - s.length; return " ".repeat(Math.floor(k / 2)) + s + " ".repeat(Math.ceil(k / 2)); };
    const a = pad(r.from), b = pad(r.to);
    const row = document.createElement("div");
    row.className = "row" + (r.small ? " small" : "");
    for (let i = 0; i < n; i++) {
      const cell = document.createElement("div");
      cell.className = "cell" + (a[i] === " " && b[i] === " " ? " blank" : "");
      const f0 = document.createElement("div"); f0.className = "face"; f0.textContent = a[i];
      const f1 = document.createElement("div"); f1.className = "face"; f1.textContent = b[i];
      if (a[i] === " ") f0.style.background = "transparent";
      if (b[i] === " ") f1.style.background = "transparent";
      if (a[i] === " ") f0.classList.add("nil");
      cell.append(f0, f1);
      row.append(cell);
      flaps.push({ row: ri, i, f0, f1, changes: a[i] !== b[i], cell });
    }
    board.append(row);
  });
  board.querySelectorAll(".face").forEach((f) => { if (f.style.background === "transparent") f.classList.add("nil"); });
  const style = document.createElement("style");
  style.textContent = ".face.nil::after{display:none}";
  document.head.append(style);

  // Bauhaus tile field: 4 x 4 modules, each a single primitive, seeded layout (deterministic)
  const TILE = [
    (c) => `<path d="M0 0 H270 V270 A270 270 0 0 1 0 0 Z" fill="${c}"/>`,               // quarter-cut
    (c) => `<circle cx="135" cy="135" r="118" fill="${c}"/>`,                                  // disc
    (c) => `<path d="M0 270 A135 135 0 0 1 270 270 Z" fill="${c}"/>`,                         // half-disc
    (c) => `<rect x="0" y="0" width="135" height="270" fill="${c}"/>`,                         // half-square
    (c) => `<path d="M0 0 L270 0 L0 270 Z" fill="${c}"/>`,                                     // triangle
    (c) => `<circle cx="135" cy="135" r="118" fill="none" stroke="${c}" stroke-width="34"/>`,  // ring
  ];
  const tiles = $("#tiles");
  let seed = 7;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  for (let i = 0; i < 16; i++) {
    const kind = Math.floor(rnd() * TILE.length);
    const col = rnd() < 0.55 ? "var(--ink)" : "var(--paper)";
    const rot = Math.floor(rnd() * 4) * 90;
    tiles.insertAdjacentHTML("beforeend",
      `<svg viewBox="0 0 270 270"><g class="t" data-rot="${rot}">${TILE[kind](col)}</g></svg>`);
  }

  // proof glyphs
  const GLYPH = [
    `<circle cx="48" cy="48" r="42"/>`,
    `<rect x="6" y="6" width="84" height="84"/>`,
    `<path d="M48 4 L92 90 L4 90 Z"/>`,
    `<path d="M6 90 V6 A84 84 0 0 1 90 90 Z"/>`,
  ];
  $("#grid").innerHTML = C.proof.map((t, i) =>
    `<div class="item"><svg viewBox="0 0 96 96"><g fill="none" stroke="var(--accent)" stroke-width="9" stroke-linejoin="round">${GLYPH[i % 4]}</g>` +
    `<g class="fill" fill="var(--accent)" opacity="0">${GLYPH[i % 4]}</g></svg><p>${t}</p></div>`).join("");

  document.querySelectorAll("#tiles .t").forEach((g) => gsap.set(g, { rotation: +g.dataset.rot, svgOrigin: "135 135" }));
  await document.fonts.ready;

  // ---------- timeline ----------
  // Everything is placed LEAD seconds late so entrances may start before frame 0 (a line
  // already mid-rise on the first frame); __seek adds LEAD back.
  const LEAD = 0.6;
  const T = (x) => x + LEAD;
  const tl = gsap.timeline({ paused: true, defaults: { ease: "poster" } });
  const show = (id, at) => tl.set(id, { visibility: "visible" }, T(at));
  const hide = (id, at) => tl.set(id, { visibility: "hidden" }, T(at));
  const metaColor = (c, at) => tl.to("#meta", { color: c, duration: 0.2, ease: "none" }, T(at));

  // A — hook (0 – 3.7)
  show("#A", 0);
  const qLen = $("#qArc").getTotalLength();
  tl.fromTo("#qArc", { drawSVG: "0%" }, { drawSVG: "100%", duration: 1.4, ease: "power2.inOut" }, T(-0.35));
  tl.from("#qDot", { scale: 0, transformOrigin: "50% 50%", duration: 0.45, ease: "back.out(2)" }, T(0.95));
  tl.from("#aHead .mask > span", { yPercent: 105, duration: 0.7, stagger: 0.12 }, T(-0.25));
  // the dot becomes the stage for the payoff
  tl.to("#qArc", { drawSVG: "100% 100%", duration: 0.5, ease: "power3.in" }, T(1.75));
  tl.to("#qDot", { attr: { cx: 540, cy: 1580, r: 640 }, duration: 0.75, ease: "expo.inOut" }, T(1.75));
  cue(2.0, "impact");
  tl.from("#aPay .mask > span", { yPercent: 105, duration: 0.6 }, T(2.1));
  tl.to("#aHead", { y: -60, duration: 1.6, ease: "none" }, T(2.0));
  // iris: the disc floods the frame and becomes scene B's field
  tl.to("#qDot", { attr: { cy: 960, r: 1250 }, duration: 0.45, ease: "power4.in" }, T(3.25));
  tl.to(["#aHead", "#aPay"], { opacity: 0, duration: 0.2, ease: "none" }, T(3.3));
  cue(3.3, "whoosh");

  // B — shift (3.7 – 7.0)
  show("#B", 3.7); hide("#A", 3.72);
  tl.from(".row", { yPercent: 40, opacity: 0, duration: 0.5, stagger: 0.08 }, T(3.7));
  tl.from("#tiles svg", { scale: 0, transformOrigin: "50% 50%", duration: 0.55, stagger: { grid: [4, 4], from: "center", each: 0.035 } }, T(3.75));
  // flips: old face folds away, new face falls in; cells cascade left→right, row by row
  let k = 0;
  flaps.forEach((f) => {
    gsap.set(f.f1, { rotationX: 90 });
    if (!f.changes) { gsap.set(f.f1, { rotationX: 0 }); gsap.set(f.f0, { opacity: 0 }); return; }
    const at = 4.5 + f.row * 0.16 + f.i * 0.04;
    tl.to(f.f0, { rotationX: -90, duration: 0.09, ease: "power2.in" }, T(at));
    tl.to(f.f1, { rotationX: 0, duration: 0.12, ease: "power2.out" }, T(at + 0.09));
    if (k++ % 2 === 0) cue(at + 0.09, "tick");
  });
  tl.to("#tiles .t", { rotation: "+=90", svgOrigin: "135 135", duration: 0.5, ease: "power3.inOut", stagger: { grid: [4, 4], from: "start", each: 0.04 } }, T(4.5));
  tl.to("#tiles .t", { rotation: "+=90", svgOrigin: "135 135", duration: 0.5, ease: "power3.inOut", stagger: { grid: [4, 4], from: "end", each: 0.04 } }, T(5.5));
  // wipe: ink rises from the bottom and becomes scene C
  tl.fromTo("#C", { clipPath: "inset(100% 0 0 0)" }, { clipPath: "inset(0% 0 0 0)", duration: 0.5, ease: "power4.inOut" }, T(6.6));
  show("#C", 6.6); hide("#B", 7.15);
  cue(6.6, "whoosh");
  metaColor("var(--paper)", 6.8);

  // C — proof (6.6 – 11.0)
  tl.from("#big4n", { yPercent: 100, duration: 0.9 }, T(6.9));
  tl.from("#C .side .mask > span", { yPercent: 105, duration: 0.6, stagger: 0.1 }, T(7.1));
  tl.from(["#hr1", "#hr2", "#hr3"], { scaleX: 0, duration: 0.6, stagger: 0.08, ease: "power3.inOut" }, T(7.5));
  document.querySelectorAll("#grid .item").forEach((it, i) => {
    const at = 8.0 + i * 0.5;
    tl.fromTo(it.querySelector("g"), { drawSVG: "0%" }, { drawSVG: "100%", duration: 0.45, ease: "power2.out" }, T(at));
    tl.to(it.querySelector(".fill"), { opacity: 1, duration: 0.25, ease: "none" }, T(at + 0.35));
    tl.from(it.querySelector("p"), { x: -30, opacity: 0, duration: 0.5 }, T(at + 0.08));
    cue(at, "pop");
  });
  tl.to("#big4n", { yPercent: -4, duration: 4, ease: "none" }, T(7.0));
  // iris out: paper disc opens from the centre and becomes scene D
  tl.fromTo("#D", { clipPath: "circle(0% at 50% 50%)" }, { clipPath: "circle(75% at 50% 50%)", duration: 0.6, ease: "power3.in" }, T(10.75));
  show("#D", 10.75); hide("#C", 11.36);
  cue(10.75, "whoosh");
  metaColor("var(--ink)", 11.05);

  // D — offer (10.75 – 15.0)
  tl.from("#sun", { scale: 0, transformOrigin: "820px 600px", duration: 1.0, ease: "expo.out" }, T(11.2));
  cue(11.2, "impact");
  tl.from("#half", { rotation: -180, transformOrigin: "0px 600px", duration: 1.0, ease: "expo.out" }, T(11.3));
  tl.fromTo("#ringG", { rotation: -40, opacity: 0, transformOrigin: "820px 600px" },
    { rotation: 30, opacity: 1, duration: 3.8, ease: "none" }, T(11.2));
  tl.from("#D .title .mask > span", { yPercent: 105, duration: 0.7, stagger: 0.1 }, T(11.45));
  tl.from("#info", { clipPath: "inset(0 100% 0 0)", duration: 0.7, ease: "power3.inOut" }, T(12.0));
  tl.from("#info div", { y: 24, opacity: 0, duration: 0.5, stagger: 0.08 }, T(12.1));
  tl.from("#cta", { scaleX: 0.2, opacity: 0, transformOrigin: "50% 50%", duration: 0.6, ease: "expo.out" }, T(12.5));
  tl.from("#cta span", { opacity: 0, duration: 0.3, stagger: 0.1, ease: "none" }, T(12.75));
  cue(12.5, "ping");
  tl.to("#sun", { scale: 1.03, transformOrigin: "820px 600px", duration: 2.5, ease: "none" }, T(12.5));
  tl.set({}, {}, T(P.duration));

  // ---------- host contract ----------
  window.__seek = (t) => { tl.totalTime(Math.min(T(t), tl.duration())); };
  window.__meta = { width: 1080, height: 1920, duration: P.duration, cues: cues.sort((a, b) => a.at - b.at), sfx: P.sfx, music: P.music };
  window.__check = () => {
    const out = [];
    const probe = [["#aHead .mask", 1.5], ["#aPay .mask", 3.0], [".row", 6.0], ["#C .side .mask", 9.9], ["#grid p", 10.4],
                   ["#D .title .mask", 14.5], ["#info div", 14.5], ["#cta span", 14.5], ["#meta span", 14.5]];
    for (const [sel, t] of probe) {
      window.__seek(t);
      document.querySelectorAll(sel).forEach((el) => {
        const r = el.getBoundingClientRect();
        // a mask wrapper is full width; measure the text it carries
        const box = el.classList.contains("mask") && el.firstElementChild ? el.firstElementChild.getBoundingClientRect() : r;
        if (box.left < 40 || box.right > 1040) out.push(`${sel} "${el.textContent.trim().slice(0, 30)}" spans ${box.left.toFixed(0)}–${box.right.toFixed(0)}px at ${t}s`);
        if (el.scrollWidth > el.clientWidth + 1 && getComputedStyle(el).overflow === "hidden") out.push(`${sel} clips horizontally at ${t}s`);
      });
    }
    window.__seek(0);
    return out;
  };
  window.__seek(0);
  window.__resolveReady();
})();
window.__ready = new Promise((r) => (window.__resolveReady = r));
</script>
</body>
</html>
